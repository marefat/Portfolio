<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandana Marefat | Under Construction</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container { max-width: 600px; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #ffffff; letter-spacing: -0.5px; }
        p { font-size: 1.1rem; color: #a0a0a0; line-height: 1.6; margin-bottom: 2rem; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #0070f3;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 2rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .links a {
            color: #0070f3; text-decoration: none; font-weight: 500; margin: 0 10px;
            transition: color 0.2s ease;
        }
        .links a:hover { color: #3291ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Mandana Marefat</h1>
        <p>Something new is in the works. A combined portfolio showcasing development, quality engineering, and design is coming soon.</p>
        <div class="links">
            <a href="mailto:your-email@example.com">Contact</a>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
        </div>
    </div>
</body>
</html>
